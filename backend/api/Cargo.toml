[package]
name = "mavicms-api"
version = "0.5.0"
edition.workspace = true
publish = false

[lib]
name = "mavicms_api"
path = "src/lib.rs"

[[bin]]
name = "mavicms-api"
path = "src/main.rs"

[[bin]]
name = "mavicms-builder"
path = "src/bin/builder.rs"

[[bin]]
name = "mavicms-edge"
path = "src/bin/edge.rs"

[dependencies]
migration = { path = "../migration" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sea-orm.workspace = true

argon2 = { version = "0.5", features = ["password-hash"] }
password-hash = { version = "0.5", features = ["getrandom"] }
aes-gcm = { version = "0.11", features = ["getrandom"] }
base64 = "0.23"
percent-encoding = "2"
form_urlencoded = "1"
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls"] }
# rustls to match rust-s3 and sea-orm: pulling native-tls would add OpenSSL to the image.
# SigV4 for object deletion, which rust-s3 signs in a way R2 rejects.
regex = "1"
tar = "0.4"
flate2 = "1"
slug = "0.1"
html-escape = "0.2"
# Markdown that arrives without its HTML has to be rendered by somebody, and
# CommonMark is a specification with a conformance suite rather than a habit.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Amazon's own SDK rather than a signed request written here: SigV4 is
# fiddly, and Amazon maintaining it is worth the compile. Apache-2.0, which
# this project's MIT licence can carry.
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
# The v1 API as well, for one call: GetSendStatistics. Bounce and complaint
# rates are what get an account suspended, and v2 only offers them through the
# paid deliverability dashboard or Virtual Deliverability Manager.
aws-sdk-ses = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
# And Support, for asking to be given a bigger quota once the sandbox is
# behind you. That request is a support case; there is no other API for it.
aws-sdk-support = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
# SNS, because an SES event destination needs a topic to publish to and a
# topic needs somebody to create it. Wiring it up by hand in the AWS console
# is the one step this panel exists to remove.
aws-smithy-types = "1"
aws-sdk-sns = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "behavior-version-latest"] }
# The randomness behind an authorization code and a refresh token, taken from
# the operating system rather than from a uuid — those carry the minute they
# were made, and these travel through browser histories and client settings.
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
# SMTP, for a site that sends through its own mail account rather than SES.
# rustls for the same reason everything else here uses it: native-tls would
# put OpenSSL in the image.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname", "ring"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "fs", "set-header"] }
tower-cookies = "0.11"
dotenvy = "0.15"

utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
