[workspace]
resolver = "3"
members = ["api", "migration"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

sea-orm = { version = "2", features = [
  "sqlx-all",
  "runtime-tokio-rustls",
  "macros",
  "with-json",
  "with-chrono",
  "with-uuid",
] }
sea-orm-migration = { version = "2", features = [
  "sqlx-all",
  "runtime-tokio-rustls",
] }

[profile.release]
# Debug symbols are most of the binary and nothing reads them in a container.
strip = true
# Release builds spend real time in LLVM; sixteen units trade a little runtime
# speed for a much shorter build, which matters far more here.
codegen-units = 16
