server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the ingress, so nginx sees http and would send browsers to an
    # http:// address of its own making. Relative redirects keep the scheme the
    # browser already had.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Nothing this server answers is for a search engine. A crawler reaching the
    # panel finds a sign-in form and indexes it, and then a customer searching
    # for their own site finds somebody's login page — this is the header that
    # takes it back out again, which robots.txt cannot do on its own.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Only ever reached on the server's own address: a hosted site's "/" goes
    # to the site, and its robots.txt is the site's business.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # "backend" is the mavicms-api service name on the compose network.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /scalar {
        proxy_pass http://backend:8080/scalar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ^~ so this wins over the static-asset regex location below for
    # uploaded images (which live on the backend, not in this image's dist/).
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The panel, and nothing else. Anything under it that is not a file is
    # the client-side router's business.
    location /admin {
        try_files $uri /admin/index.html;
    }

    # "/" is where a hosted site publishes. On a server that hosts sites this
    # location is never reached — the ingress sends "/" to the site — so this
    # is only what someone typing the bare address of the panel gets.
    location = / {
        return 302 /admin/;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
